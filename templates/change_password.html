{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/change_password.css') }}">
{% endblock %}

{% block content %}

<div class="change-password-container">

    <div class="change-password-card">

        <h2>
            <i class="fa-solid fa-lock"></i>
            Change Password
        </h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <p class="flash">{{ msg }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="input-box">
                <input type="password"
                       name="current_password"
                       placeholder="Current Password"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="new_password"
                       placeholder="New Password"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm New Password"
                       required>
            </div>

            <button type="submit" class="change-btn">
                <i class="fa-solid fa-check"></i>
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
