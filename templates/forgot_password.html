{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
{% endblock %}

{% block content %}

<div class="forgot-container">

    <div class="forgot-card">

        <h2>
            <i class="fa-solid fa-key"></i>
            Forgot Password
        </h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p class="flash">{{ msg }}</p>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="input-box">
                <input type="email"
                       name="email"
                       placeholder="Registered Email"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="new_password"
                       placeholder="New Password"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm Password"
                       required>
            </div>

            <button class="forgot-btn" type="submit">
                Reset Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
